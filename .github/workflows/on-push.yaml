name: PR Status Checks

# `awg-2.0-extensions` alongside `master`: it is this fork's long-lived
# integration branch, and every PR so far has targeted it rather than master.
# With only `master` listed, none of the jobs below had ever run against that
# work -- 47 commits, with only Semgrep and the review bot for company. A
# `pull_request` entry filters on the *base* branch, so this covers the
# short-lived branches that merge into it too.
on:
  push:
    branches: [ "master", "awg-2.0-extensions" ]
  pull_request:
    branches: [ "master", "awg-2.0-extensions" ]

# Third-party actions are pinned to commit SHAs; GitHub-owned ones (actions/*)
# stay on major tags. Neither pin below may be "simplified" to the SHA its
# moving ref happens to resolve to:
#  - dtolnay/rust-toolchain: toolchain-named refs (`stable`) are synthetic
#    commits *outside master's history*, garbage-collected when the branch is
#    rewritten on release -- the README requires pinning a master SHA and
#    naming the toolchain via the `toolchain:` input instead (at a master SHA
#    that input is mandatory, and the ref name is never read by the action).
#  - taiki-e/install-action: `@cargo-hack` is a tag re-pointed on every
#    release, with the same dangling-commit hazard, so the pin is a release
#    SHA with the tool named via `tool:`. That also freezes the *installed*
#    cargo-hack at the release's embedded manifest -- reproducibility over
#    freshness -- so bumping the SHA is what updates cargo-hack.

jobs:
  # Depends on all actions that are required for a "successful" CI run.
  # Based on the ci here: https://github.com/tokio-rs/tokio/blob/master/.github/workflows/ci.yml
  all-systems-go:
    runs-on: ubuntu-latest
    needs:
      - check_features
      - clippy
      - rustfmt
      - tests
      - integration-tests
      - test-windows
      - win7-msrv
      - jni-smoke
      - ffi-header-layout
    steps:
      - run: exit 0

  # `src/jni.rs` cannot be reached by `cargo test`: its entry points take a
  # `JNIEnv` and only exist to be called through JNI dispatch, so every other
  # job in this file proves the bindings compile and nothing more. That gap let
  # the jni 0.22 migration turn a thrown ArrayIndexOutOfBoundsException into a
  # silent null -- found only because a reviewer built the library and ran a
  # Java harness by hand. This runs that harness on every push.
  #
  # `-Xcheck:jni` is set inside the script: it makes the JVM validate each JNI
  # call the library makes, which is most of the value of using a real VM rather
  # than trusting a compile.
  jni-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/jni-smoke.sh

  # `wireguard_ffi.h` is hand-written -- there is no cbindgen -- so the C and
  # Rust declarations of the ABI can only drift apart silently, and a layout
  # disagreement is not a build failure in either language: it is a caller's
  # `reject_after_time` arriving as somebody else's field. This compiles a file
  # of static assertions against the header, pinning the same offsets, member
  # widths and total size that `ffi::tests::awg_params_layout_is_pinned` pins on
  # the Rust side. Nothing runs; a mismatch fails the compile.
  #
  # Both word sizes, because `wireguard_awg_params::size` is the ABI's
  # forward-compatibility anchor and the WireSock client ships i686 and x86_64:
  # a struct whose size differed between them would make the versioning rule
  # meaningless.
  ffi-header-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit C support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Check the C header against the pinned ABI layout (64-bit)
        run: gcc -m64 -std=c11 -Wall -Wextra -Werror -c scripts/ffi-layout-check.c -o /dev/null
      - name: Check the C header against the pinned ABI layout (32-bit)
        run: gcc -m32 -std=c11 -Wall -Wextra -Werror -c scripts/ffi-layout-check.c -o /dev/null

  # The WireSock client builds the i686/x86_64 Windows targets with Rust 1.75,
  # the last toolchain that supports Windows 7 (declared as rust-version in
  # boringtun/Cargo.toml). Modern Cargo writes a v4 lockfile that Cargo 1.75
  # cannot read, and some locked crates' manifests need edition2024 support it
  # cannot parse, so this mirrors the client's boringtun.cmd: pin the last
  # 1.75-safe crate versions, rewrite only the lockfile format header to v3,
  # then build with 1.75 against that lock.
  #
  # The 1.75 builds are build-only, deliberately: the dev-dependencies' MSRVs
  # exceed 1.75, so test code cannot compile on it. Syntax-level breakage in
  # test code still fails the build (feature gates are checked before
  # cfg-stripping -- the inline-const this job was added for lived in a
  # #[cfg(test)] module), and the clippy step below closes the remaining hole:
  # it denies incompatible_msrv across all targets, with
  # check-incompatible-msrv-in-tests enabled in clippy.toml so test-only use
  # of std APIs newer than rust-version fails the job too.
  win7-msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay installs the minimal profile, so clippy must be asked for. The
      # action activates its toolchain with `rustup default` -- the weakest
      # level of rustup's precedence -- so the explicit `cargo +1.75.0` and
      # `cargo +stable` below outrank it and the 1.75 pin is untouched.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
          components: clippy
      - name: Deny MSRV-incompatible API use (all targets)
        run: cargo +stable clippy -p boringtun --all-targets --features=ffi-bindings -- -D clippy::incompatible_msrv
      - name: Install Rust 1.75
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          rustup target add i686-pc-windows-msvc --toolchain 1.75.0
      - name: Prepare a 1.75-compatible lockfile
        # The per-line exit checks match boringtun.cmd's `|| goto :win7_fail`:
        # the pwsh wrapper only inspects the final exit code, and a masked
        # update failure would surface as a confusing error at the build step.
        run: |
          cargo +stable update -p zeroize --precise 1.8.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable update -p zeroize_derive --precise 1.4.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +stable update -p time --precise 0.3.41
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-Content Cargo.lock) -replace '^version = [0-9]+$','version = 3' | Set-Content Cargo.lock -Encoding ascii
      - name: Build with Rust 1.75 (x86_64)
        run: cargo +1.75.0 build -p boringtun --target=x86_64-pc-windows-msvc --features=ffi-bindings --locked
      - name: Build with Rust 1.75 (i686)
        run: cargo +1.75.0 build -p boringtun --target=i686-pc-windows-msvc --features=ffi-bindings --locked

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable

      - name: Check Windows
        run: cargo check -p boringtun

      - name: Test Windows
        run: cargo test -p boringtun

  check_features:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-hack
      - run: cargo hack check --each-feature

  clippy:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-hack
      - run: cargo hack clippy --each-feature

  rustfmt:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-hack
      - run: cargo hack test --each-feature

  integration-tests:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
      - run: cargo test -- --ignored
