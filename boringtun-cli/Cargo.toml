[package]
# Upstream authorship retained; this fork's additions credited alongside it.
authors = ["Noah Kennedy <nkennedy@cloudflare.com>", "Andy Grover <agrover@cloudflare.com>", "Jeff Hiner <jhiner@cloudflare.com>", "WireSock <support@wiresock.net>"]
description = "a userspace WireGuard® implementation with AmneziaWG and WireSock protocol extensions, forked from Cloudflare BoringTun"
documentation = "https://github.com/Wiresock-Foundation/wiresock-boringtun"
edition = "2021"
license = "BSD-3-Clause"
name = "boringtun-cli"
readme = "../README.md"
repository = "https://github.com/Wiresock-Foundation/wiresock-boringtun"
version = "0.7.1"

[dependencies]
clap = {version = "4.6.0", features = ["env"]}
daemonize = "0.5"
tracing = "0.1.40"
tracing-appender = "0.2.1"
tracing-subscriber = "0.3.19"

[dependencies.boringtun]
features = ["device"]
path = "../boringtun"
version = "0.7.1"
